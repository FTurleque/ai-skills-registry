name: validate

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: python -m pip install --quiet pyyaml jsonschema

      - name: Auto-test du validateur
        run: python tools/validate.py --self-test

      - name: Valider le registre
        run: python tools/validate.py

      - name: Verifier que INDEX.md est a jour
        run: python tools/generate_index.py --check

      - name: Auto-test des moteurs livres dans les artefacts
        run: |
          for selftest in $(git ls-files '*/supervisor.py'); do
            echo "--- $selftest"
            python "$selftest" --self-test
          done
